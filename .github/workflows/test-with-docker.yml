name: Run Tests with Docker (Alternative)

# This workflow is disabled by default - remove the 'workflow_dispatch' to enable it
on:
  workflow_dispatch:

env:
  DB_ROOT_PASSWORD: root
  DB_DATABASE: tournament_app_testing
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  test-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create testing environment file
      run: |
        cat > .env << EOF
        APP_NAME=Laravel
        APP_ENV=testing
        APP_KEY=
        APP_DEBUG=true
        APP_URL=http://localhost:8001

        LOG_CHANNEL=stack
        LOG_DEPRECATIONS_CHANNEL=null
        LOG_LEVEL=debug

        DB_CONNECTION=mysql
        DB_HOST=db
        DB_PORT=3306
        DB_DATABASE=tournament_app_testing
        DB_USERNAME=root
        DB_PASSWORD=root

        BROADCAST_DRIVER=log
        CACHE_DRIVER=array
        FILESYSTEM_DISK=public
        QUEUE_CONNECTION=sync
        SESSION_DRIVER=array
        SESSION_LIFETIME=120

        MEMCACHED_HOST=127.0.0.1

        REDIS_HOST=127.0.0.1
        REDIS_PASSWORD=null
        REDIS_PORT=6379

        MAIL_MAILER=array
        MAIL_HOST=mailpit
        MAIL_PORT=1025
        MAIL_USERNAME=null
        MAIL_PASSWORD=null
        MAIL_ENCRYPTION=null
        MAIL_FROM_ADDRESS="hello@example.com"
        MAIL_FROM_NAME="\${APP_NAME}"

        AWS_ACCESS_KEY_ID=
        AWS_SECRET_ACCESS_KEY=
        AWS_DEFAULT_REGION=us-east-1
        AWS_BUCKET=
        AWS_USE_PATH_STYLE_ENDPOINT=false

        PUSHER_APP_ID=
        PUSHER_APP_KEY=
        PUSHER_APP_SECRET=
        PUSHER_HOST=
        PUSHER_PORT=443
        PUSHER_SCHEME=https
        PUSHER_APP_CLUSTER=mt1

        VITE_PUSHER_APP_KEY="\${PUSHER_APP_KEY}"
        VITE_PUSHER_HOST="\${PUSHER_HOST}"
        VITE_PUSHER_PORT="\${PUSHER_PORT}"
        VITE_PUSHER_SCHEME="\${PUSHER_SCHEME}"
        VITE_PUSHER_APP_CLUSTER="\${PUSHER_APP_CLUSTER}"

        TELESCOPE_ENABLED=false
        EOF

    - name: Build and run with Docker Compose
      run: |
        # Start the services
        docker-compose up -d db
        
        # Wait for database to be ready
        echo "Waiting for database to be ready..."
        sleep 30
        
        # Build and start the app
        docker-compose up -d --build app
        
        # Wait for app to be ready
        sleep 10

    - name: Install dependencies and run tests
      run: |
        # Install PHP dependencies
        docker-compose exec -T app composer install --optimize-autoloader
        
        # Install Node dependencies and build assets
        docker-compose exec -T app npm ci
        docker-compose exec -T app npm run build
        
        # Generate application key
        docker-compose exec -T app php artisan key:generate
        
        # Run migrations
        docker-compose exec -T app php artisan migrate --env=testing --force
        
        # Run tests
        docker-compose exec -T app php artisan test --env=testing

    - name: Cleanup
      if: always()
      run: docker-compose down -v

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: docker-test-results
        path: |
          storage/logs/