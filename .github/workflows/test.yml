name: Run Tests

on:
  push:
    branches: [ feature/serbian-app ]
  pull_request:
    branches: [ feature/serbian-app ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tournament_app_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: pdo, pdo_mysql, mbstring, exif, pcntl, bcmath, gd
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Create testing environment file
      run: |
        cat > .env << EOF
        APP_NAME=Laravel
        APP_ENV=testing
        APP_KEY=
        APP_DEBUG=true
        APP_URL=http://localhost:8001

        LOG_CHANNEL=stack
        LOG_DEPRECATIONS_CHANNEL=null
        LOG_LEVEL=debug

        DB_CONNECTION=mysql
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_DATABASE=tournament_app_testing
        DB_USERNAME=root
        DB_PASSWORD=root

        BROADCAST_DRIVER=log
        CACHE_DRIVER=array
        FILESYSTEM_DISK=public
        QUEUE_CONNECTION=sync
        SESSION_DRIVER=array
        SESSION_LIFETIME=120

        MEMCACHED_HOST=127.0.0.1

        REDIS_HOST=127.0.0.1
        REDIS_PASSWORD=null
        REDIS_PORT=6379

        MAIL_MAILER=array
        MAIL_HOST=mailpit
        MAIL_PORT=1025
        MAIL_USERNAME=null
        MAIL_PASSWORD=null
        MAIL_ENCRYPTION=null
        MAIL_FROM_ADDRESS="hello@example.com"
        MAIL_FROM_NAME="\${APP_NAME}"

        AWS_ACCESS_KEY_ID=
        AWS_SECRET_ACCESS_KEY=
        AWS_DEFAULT_REGION=us-east-1
        AWS_BUCKET=
        AWS_USE_PATH_STYLE_ENDPOINT=false

        PUSHER_APP_ID=
        PUSHER_APP_KEY=
        PUSHER_APP_SECRET=
        PUSHER_HOST=
        PUSHER_PORT=443
        PUSHER_SCHEME=https
        PUSHER_APP_CLUSTER=mt1

        VITE_PUSHER_APP_KEY="\${PUSHER_APP_KEY}"
        VITE_PUSHER_HOST="\${PUSHER_HOST}"
        VITE_PUSHER_PORT="\${PUSHER_PORT}"
        VITE_PUSHER_SCHEME="\${PUSHER_SCHEME}"
        VITE_PUSHER_APP_CLUSTER="\${PUSHER_APP_CLUSTER}"

        TELESCOPE_ENABLED=false
        EOF

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --optimize-autoloader

    - name: Install npm dependencies
      run: npm ci

    - name: Build assets
      run: npm run build

    - name: Generate application key
      run: php artisan key:generate

    - name: Directory permissions
      run: chmod -R 755 storage bootstrap/cache

    - name: Create database
      run: |
        mysql --host 127.0.0.1 --port 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS tournament_app_testing;"

    - name: Run database migrations
      run: php artisan migrate --env=testing --force

    - name: Run database seeders (if needed)
      run: php artisan db:seed --env=testing --force
      continue-on-error: true

    - name: Run tests
      run: php artisan test --env=testing

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: |
          storage/logs/
          tests/